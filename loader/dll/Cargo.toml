[package]
name = "amml-loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[lib]
name = "amml"
crate-type = ["cdylib", "rlib"]

[dependencies]
amml-abi = { path = "../abi" }
amml-data = { path = "../../derive/data" }
amml-runtime = { path = "../runtime" }
curia.workspace = true
hcl-rs.workspace = true
retour = "0.3"
region = "3"
serde_json.workspace = true
thiserror.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_SystemServices"] }

[dev-dependencies]
pelite.workspace = true
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
