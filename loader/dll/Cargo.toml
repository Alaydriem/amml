[package]
name = "amml-loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[lib]
name = "amml"
crate-type = ["cdylib", "rlib"]

[dependencies]
amml-abi = { path = "../abi" }
amml-data = { path = "../../derive/data" }
amml-msvc = { path = "../../sdk/msvc" }
amml-runtime = { path = "../runtime" }
curia.workspace = true
hcl-rs.workspace = true
retour = "0.3"
region = "3"
serde_json.workspace = true
thiserror.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
pelite.workspace = true
tempfile.workspace = true

[features]
# Logs every distinct folder request the game makes and also routes GetTempPathW through the loader (for finding out which calls a game build needs).
folder-trace = []

[[test]]
name = "integration"
path = "tests/integration.rs"
