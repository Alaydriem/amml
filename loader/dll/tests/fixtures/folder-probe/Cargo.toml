[lib]
name = "folder_probe"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_UI_Shell",
] }
