[package]
name = "amml-testmod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[lib]
name = "amml_testmod"
crate-type = ["cdylib", "rlib"]

[dependencies]
amml-game = { path = "../../sdk/game" }
amml-msvc = { path = "../../sdk/msvc" }
amml-sdk = { path = "../../sdk/sdk" }
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
