[workspace]
resolver = "3"
members = ["derive/data", "derive/cli", "sdk/msvc", "sdk/game", "sdk/msvc-fixture", "loader/abi", "loader/runtime", "loader/dll", "sdk/sdk", "loader/testmod", "loader/patch", "loader/patch/tests/fixtures/anchor-stub", "loader/dll/tests/fixtures/echo-mod", "loader/dll/tests/fixtures/folder-probe", "ui/kit", "ui/gen", "ui/rules", "ui/studio", "i18n/runtime", "i18n/tool", "launcher/registry", "launcher/gdk", "launcher/core", "launcher/bridge", "launcher/app/src-tauri"]

[workspace.package]
version = "26.60.5"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
hcl-rs = "=0.19.8"
thiserror = "2.0.21"
tempfile = "3.27.0"
pelite = "0.10"
memchr = "2"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { version = "4", features = ["derive"] }
cc = "1"
curia = "=0.2.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui_kittest = { version = "=0.37.0" }
serde = { version = "1.0.229", features = ["derive"] }
# egui writes its warnings through `log`; amml-ui's tests read them
log = "0.4.34"
amml-studio-ui = { path = "ui/studio" }
amml-ui = { path = "ui/kit" }
amml-i18n = { path = "i18n/runtime" }
amml-ui-rules = { path = "ui/rules" }
icu_plurals = "2.2"
icu_locale_core = "2.2"
# `sync` makes ICU data payloads use Arc, so a Localizer can live in egui's context data
icu_provider = { version = "2.3", features = ["sync"] }
polib = "0.3"
ts-rs = { version = "12.0", features = ["serde-compat"] }
ureq = "3.5.0"
sha2 = "0.10.9"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
base64 = "0.23"
uuid = { version = "1.28", features = ["v4"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Management_Deployment",
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
