[package]
name = "amml-launcher-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "The AMML launcher window"
default-run = "amml-launcher-app"
autotests = false

[lints]
workspace = true

[lib]
name = "amml_launcher_app_lib"
path = "src/lib.rs"

[[bin]]
name = "amml-launcher-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
amml-gdk = { path = "../../gdk" }
amml-i18n.workspace = true
amml-launcher-bridge = { path = "../../bridge" }
amml-launcher-core = { path = "../../core" }
curia.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-curia = { git = "https://github.com/charlesportwoodii/tauri-plugin-curia", tag = "0.2.2" }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.1"

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
