[tasks.ingame-headless-input]
description = "Runs headless-input and modmanager in game on a patched standalone test instance under %LOCALAPPDATA%/amml/instances (--instance, required; the instance checks of ingame-zoom). Refuses a running game of the instance. Seeds the per-mod world amml-test-headless-input from the instance's amml-test world (once, with its own pristine copy) and restores it from that copy; the shared amml-test world is not changed. Sets pause_menu_on_focus_lost:0 for the run. Builds the release amml.dll and copies it, the recipes and the data into the instance; runs mise run package in the modmanager checkout (--modmanager, else AMML_MODMANAGER_DIR, else ../modmanager) and builds headless-input (--headless, else AMML_HEADLESS_DIR, else ../headless-input) with the test-only feature ingame-proof (a pairing request is allowed without the switch) into target/ingame-headless-input/dist; runs mise run compat on both dist folders and stops before the game on a failure. Parks every mod, installs the two, writes the mod config with MCP on (port 28361 on 1.26.63.01-test, else 28362). Starts the game with AMML_TEST_WORLD, pairs through POST /pair and drives the MCP tools (scripts/mcp-call.ps1): press F1 before any real key, hotbar 3, the square example, walk_to 3 blocks east, turn then look_at 0/30, /say, a screenshot, /execute into the nether with walk_until_dimension, leave_world, join_world, join_server 127.0.0.1:19999; then posts F24 as the first real key. Closes the window it started and ends only that process. Prints the three logs of the run. Passes on every summary row: the link, two local ticks, client.game_tick offered, key tap sent with no real key down before it, hotbar selected, the square, walk_to and look runs done with the read look within 1 degree of 0/30, the command line, screenshot written and a PNG, the nether run done, the leave lines, the world join, the servers tab and join answer lines, actor position measured, first real key down, and no 'event not available', 'area not available' or 'panic' line"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" required=#true help="The test instance folder under %LOCALAPPDATA%/amml/instances (1.26.63.01-test, 1.26.70.26-standalone); 1.26.63.01 and 1.26.63.01-P are refused"
flag "--headless <dir>" help="The headless-input checkout to build; default: AMML_HEADLESS_DIR, else ../headless-input"
flag "--modmanager <dir>" help="The modmanager checkout to build; default: AMML_MODMANAGER_DIR, else ../modmanager"
'''
run = 'bash scripts/ingame-headless-input.sh'

[tasks.ingame-toggles]
