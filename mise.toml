[tasks.ingame-ll-zoom]
description = "Builds every AMML mod in its own repo (manager, minimap, levels, freecam, zoom and stratum) and installs all of them into mods/amml, and fails on a failed build or an installed DLL older than a source file it is built from (scripts/ingame-mods.sh). Packages the loader into the 1.26.51.01-ll test copy and installs them into mods/amml (their config/ is kept), starts Minecraft.Windows.exe with grade on for the run, waits up to 180 s for the mod manager to register alaydriem-zoom, ends only the process it started, restores the loader config and prints the loader, zoom and manager lines of the run"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
game="$LOCALAPPDATA/amml/instances/1.26.51.01-ll"
logs="$game/logs/amml"
manager_logs="$game/logs/amm/alaydriem-mod-manager"
config="$game/mods/amml-loader/amml.hcl"
if [ -d "$game/mods/alaydriem-zoom" ]; then echo "the C++ zoom is still in mods/alaydriem-zoom; back it up and remove it first (two zooms must not run at once)"; exit 1; fi
. scripts/ingame-mods.sh
build_mods ""
mise run package-ll --game "$game"
install_mods "$game/mods/amml"
saved=""
if [ -f "$config" ]; then saved=$(mktemp); cp "$config" "$saved"; fi
restore() { if [ -n "$saved" ]; then cp "$saved" "$config" && rm -f "$saved" || return 1; else rm -f "$config"; fi; }
. scripts/game-pid.sh
. scripts/ingame-common.sh
game_pid=""
launched=""
trap 'end_game; restore' EXIT
printf 'grade = true\n' > "$config"
mkdir -p "$logs" "$manager_logs"
loader_start=$(size_of "$logs/loader.log")
zoom_start=$(size_of "$logs/alaydriem-zoom.log")
remember_session_logs "$manager_logs"
before=" $(echo $(game_pids)) "
(cd "$game" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  current="$(session_logs | tail -n 1)"
  if [ -n "$current" ] && grep -q '"mod_id":"alaydriem-zoom"' "$current"; then outcome="linked"; break; fi
  if since "$logs/alaydriem-zoom.log" "$zoom_start" | grep -q "zoom is off"; then outcome="zoom off"; break; fi
  if [ -z "$game_pid" ]; then find_game_pid "$game"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome"
# a few more seconds so the first zoom ticks reach the logs
if [ "$outcome" = "linked" ]; then sleep 5; fi
end_game
current="$(session_logs | tail -n 1)"
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start"
echo "--- alaydriem-zoom.log (this run)"
since "$logs/alaydriem-zoom.log" "$zoom_start"
echo "--- mod manager log (this run): $current"
if [ -n "$current" ]; then cat "$current"; fi
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|grade: |alaydriem-zoom" || true
if [ -n "$current" ]; then grep "alaydriem-zoom" "$current" || true; fi
[ "$outcome" = "linked" ]
'''

[tasks.ingame-standalone-zoom]
description = "Builds every AMML mod in its own repo (manager, minimap, levels, freecam, zoom and stratum) and installs all of them into mods/amml, and fails on a failed build or an installed DLL older than a source file it is built from (scripts/ingame-mods.sh). Refreshes the 1.26.51.01-standalone standalone instance, installs them into its mods/amml and takes the manager out again (this run checks zoom without it), starts its patched Minecraft.Windows.exe, waits up to 180 s for zoom to report the mod manager missing, ends only the process it started and prints the loader and zoom lines of the run"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
game="$LOCALAPPDATA/amml/instances/1.26.51.01-ll"
instance="$LOCALAPPDATA/amml/instances/1.26.51.01-standalone"
logs="$instance/amml/logs"
. scripts/ingame-mods.sh
build_mods ""
mise run make-standalone-instance --game "$game" --instance "$instance"
install_mods "$instance/mods/amml"
# this run checks zoom without the manager, so the manager that every task installs is taken out again
rm -rf "$instance/mods/amml/alaydriem-mod-manager"
mkdir -p "$logs"
. scripts/ingame-common.sh
loader_start=$(size_of "$logs/loader.log")
zoom_start=$(size_of "$logs/alaydriem-zoom.log")
. scripts/game-pid.sh
game_pid=""
launched=""
trap end_game EXIT
before=" $(echo $(game_pids)) "
(cd "$instance" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  if since "$logs/alaydriem-zoom.log" "$zoom_start" | grep -q "zoom is off"; then outcome="manager missing"; break; fi
  if [ -z "$game_pid" ]; then find_game_pid "$instance"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome"
# a few more seconds to show that the game keeps running with zoom off
if [ "$outcome" = "manager missing" ]; then sleep 5; fi
end_game
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start"
echo "--- alaydriem-zoom.log (this run)"
since "$logs/alaydriem-zoom.log" "$zoom_start"
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|alaydriem-zoom" || true
since "$logs/alaydriem-zoom.log" "$zoom_start" | grep "zoom is off" || true
[ "$outcome" = "manager missing" ]
'''

[tasks.ingame-ll-manager]
description = "Builds every AMML mod in its own repo (manager, minimap, levels, freecam, zoom and stratum) and installs all of them into mods/amml, and fails on a failed build or an installed DLL older than a source file it is built from (scripts/ingame-mods.sh). Moves the C++ manager and every LeviLamina mod that depends on it from mods to mods-disabled of the 1.26.51.01-ll test copy (a folder already in mods-disabled is never overwritten), packages the loader, installs them into mods/amml (their config/ is kept), starts Minecraft.Windows.exe with grade on for the run, waits up to 180 s for the manager to bind its overlay and register alaydriem-zoom, ends only the process it started, restores the loader config and prints the lines of the run. Passes when every entry that applies to this build resolves (an entry an entry_is check refuses is not for this build, not missing), both mods load, the manager binds its overlay and registers zoom, and zoom never logs zoom is off. --screenshot <dir> saves two screenshots of the game window; between them it posts Ctrl+Shift+F10, an attempt only, which cannot open the panel (the manager reads the modifiers with GetAsyncKeyState). --cpp-manager is the negative run: it puts the C++ manager back for this run only and passes when the AMML manager logs the duplicate line and the game keeps running"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--screenshot <dir>" help="Saves two screenshots of the game window into this folder, 2 s apart, with Ctrl+Shift+F10 posted between them (an attempt only; it cannot open the panel); no screenshot without it"
flag "--cpp-manager" help="The negative run: puts mods-disabled/alaydriem-mod-manager back into mods for this run only"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the test copies live under %LOCALAPPDATA%/amml/instances"; exit 1; }
game="$LOCALAPPDATA/amml/instances/1.26.51.01-ll"
negative=""
if [ "${usage_cpp_manager:-false}" = "true" ]; then negative="yes"; fi
shots="${usage_screenshot:-}"
logs="$game/logs/amml"
manager_logs="$game/logs/amm/alaydriem-mod-manager"
ll_log="$game/logs/latest.log"
config="$game/mods/amml-loader/amml.hcl"
disabled="$game/mods-disabled"
command -v jq > /dev/null || { echo "jq is needed to read the LeviLamina manifests; run mise install in this repo"; exit 1; }
if [ -d "$game/mods/alaydriem-zoom" ]; then echo "the C++ zoom is still in mods/alaydriem-zoom; back it up and remove it first (two zooms must not run at once)"; exit 1; fi
# the C++ manager (by its manifest name) and each mod whose manifest depends on it go to mods-disabled; a
# second run finds nothing to move
echo "--- moves"
mkdir -p "$disabled"
moved=""
for manifest in "$game"/mods/*/manifest.json; do
  [ -f "$manifest" ] || continue
  dir="${manifest%/manifest.json}"
  name="${dir##*/}"
  uses=$(jq -r '(.name == "alaydriem-mod-manager") or ([(.dependencies // [])[]?.name] | index("alaydriem-mod-manager") != null)' "$manifest")
  [ "$uses" = "true" ] || continue
  if [ -e "$disabled/$name" ]; then echo "mods/$name is not moved: mods-disabled/$name already exists; sort the two out by hand"; exit 1; fi
  mv "$dir" "$disabled/$name"
  echo "moved mods/$name to mods-disabled/$name"
  moved="yes"
done
[ -n "$moved" ] || echo "nothing to move"
. scripts/ingame-mods.sh
build_mods ""
mise run package-ll --game "$game"
install_mods "$game/mods/amml"
saved=""
if [ -f "$config" ]; then saved=$(mktemp); cp "$config" "$saved"; fi
restore() { if [ -n "$saved" ]; then cp "$saved" "$config" && rm -f "$saved" || return 1; else rm -f "$config"; fi; }
cpp_back=""
# moves the C++ manager out again after the negative run
park_cpp() {
  [ -n "$cpp_back" ] || return 0
  if [ -e "$disabled/alaydriem-mod-manager" ]; then echo "mods-disabled/alaydriem-mod-manager exists; mods/alaydriem-mod-manager is left in place"; return 0; fi
  mv "$game/mods/alaydriem-mod-manager" "$disabled/alaydriem-mod-manager" || return 1
  echo "moved mods/alaydriem-mod-manager back to mods-disabled/alaydriem-mod-manager"
  cpp_back=""
}
. scripts/game-pid.sh
. scripts/ingame-common.sh
game_pid=""
launched=""
# each step runs whatever the one before did. The game ends first, because Windows does not let a folder move
# while the game holds the C++ manager's DLL open; then the C++ manager goes back, then the loader config
trap 'end_game || echo "ending the game failed"; park_cpp || echo "moving mods/alaydriem-mod-manager back to mods-disabled failed; move it by hand"; restore || echo "restoring $config failed"' EXIT
if [ -n "$negative" ]; then
  [ -d "$disabled/alaydriem-mod-manager" ] || { echo "no C++ manager in mods-disabled/alaydriem-mod-manager"; exit 1; }
  mv "$disabled/alaydriem-mod-manager" "$game/mods/alaydriem-mod-manager"
  cpp_back="yes"
  echo "negative run: put mods-disabled/alaydriem-mod-manager back into mods for this run"
fi
printf 'grade = true\n' > "$config"
mkdir -p "$logs" "$manager_logs"
loader_start=$(size_of "$logs/loader.log")
manager_amml_start=$(size_of "$logs/alaydriem-mod-manager.log")
zoom_start=$(size_of "$logs/alaydriem-zoom.log")
ll_start=$(size_of "$ll_log")
remember_session_logs "$manager_logs"
duplicate="another alaydriem-mod-manager.dll is loaded from"
bound="overlay bound"
before=" $(echo $(game_pids)) "
(cd "$game" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  if [ -n "$negative" ]; then
    if since "$logs/alaydriem-mod-manager.log" "$manager_amml_start" | grep -q "$duplicate"; then outcome="duplicate"; break; fi
    if since "$logs/loader.log" "$loader_start" | grep -q 'mod loaded {"mod_name":"alaydriem-mod-manager"}'; then outcome="both loaded"; break; fi
  else
    if session_has '"mod_id":"alaydriem-zoom"' && session_has "$bound"; then outcome="linked"; break; fi
    if since "$logs/alaydriem-zoom.log" "$zoom_start" | grep -q "zoom is off"; then outcome="zoom off"; break; fi
  fi
  if [ -z "$game_pid" ]; then find_game_pid "$game"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome"
running="no"
if [ "$outcome" = "linked" ] || [ "$outcome" = "duplicate" ] || [ "$outcome" = "both loaded" ]; then
  # more time so the first frames and ticks reach the logs, and the negative run shows the game keeps running
  sleep 15
  if [ -z "$game_pid" ]; then find_game_pid "$game"; fi
  if pid_alive; then running="yes"; fi
fi
if [ "$running" = "yes" ] && [ -n "$shots" ]; then
  echo "--- screenshots"
  if [ -n "$negative" ]; then capture ll-cpp-manager; else capture ll; fi
fi
end_game
echo "--- LeviLamina mod lines (this run)"
since "$ll_log" "$ll_start" | grep -E "alaydriem-mod-manager|amml-loader" || true
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start"
echo "--- alaydriem-mod-manager.log (this run)"
since "$logs/alaydriem-mod-manager.log" "$manager_amml_start"
echo "--- alaydriem-zoom.log (this run)"
since "$logs/alaydriem-zoom.log" "$zoom_start"
for path in $(session_logs); do
  echo "--- manager session log (this run): $path"
  cat "$path"
done
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|not for this build|grade: |mod entries|mod loaded|mod switched off|mod could not be loaded" || true
since "$logs/alaydriem-mod-manager.log" "$manager_amml_start" | grep "$duplicate" || true
since "$logs/alaydriem-zoom.log" "$zoom_start" | grep "zoom is off" || true
for path in $(session_logs); do grep -E "$bound|overlay frames run|mod registered" "$path" || true; done
echo "game running after the wait: $running"
if [ -n "$negative" ]; then
  [ "$outcome" = "duplicate" ] && [ "$running" = "yes" ]
else
  # checked over the whole run: all entries resolve (resolved N/N), both mods load, and zoom never logs zoom is off
  failed=""
  since "$logs/loader.log" "$loader_start" | grep -q -E 'resolved ([0-9]+)/\1;' || { echo "FAIL: the loader did not resolve all entries"; failed="yes"; }
  # an entry an entry_is check refuses is not for this build (INFO, counted apart); any other unresolved entry is missing
  if since "$logs/loader.log" "$loader_start" | grep -q -F "mod entries did not all resolve"; then echo "FAIL: a mod has a missing entry"; failed="yes"; fi
  for mod in alaydriem-mod-manager alaydriem-zoom; do
    since "$logs/loader.log" "$loader_start" | grep -q -F "mod loaded {\"mod_name\":\"$mod\"}" || { echo "FAIL: $mod did not load"; failed="yes"; }
  done
  if since "$logs/alaydriem-zoom.log" "$zoom_start" | grep -q "zoom is off"; then echo "FAIL: zoom logged zoom is off"; failed="yes"; fi
  [ "$outcome" = "linked" ] && [ -z "$failed" ]
fi
'''

