[tasks.ingame-quirks]
description = "Runs quirks and modmanager in game on a patched standalone test instance under %LOCALAPPDATA%/amml/instances (--instance, required; the same instance checks as ingame-apitest). Refuses a running game of the instance. Seeds and restores the world amml-test-quirks (seed_mod_world), sets pause_menu_on_focus_lost:0 for the run, builds and copies the release amml.dll, the recipes and the data, runs mise run package in modmanager (--modmanager, else AMML_MODMANAGER_DIR, else ../modmanager) and package plus package-test-no-keep-alive in quirks (--quirks, else AMML_QUIRKS_DIR, else ../quirks), runs compat on both dist folders and stops before the game on a failure, and parks the other mods of the instance. Run A (shipped build): waits for 'attached to the mod manager', the HUD screen, then up to 120 s for 'idle keep-alive: fired' and the loader's note_activity line, closes the game. Run B (test-no-keep-alive build, skipped with --skip-idle): restores the world, starts again and waits with no input up to --idle-seconds (default 1080) for 'idle guard: refused the idle screen', then 20 s more. Ends only the processes it started. Passes on the link, the keep-alive on and first fire (count=1), the loader note_activity result=ok, area adapter client.activity and event offered client.idle_screen_open, the off line at close; in run B the refusal, the idle screen thread line, no idle top screen name and no fire; and no 'event not available', 'area not available' or 'panic' line in any log of either run"
