[tasks.ingame-ll-minimap]
description = "Builds every AMML mod in its own repo (manager, minimap, levels, freecam, zoom and stratum) and installs all of them into mods/amml, and fails on a failed build or an installed DLL older than a source file it is built from (scripts/ingame-mods.sh). Packages the loader into the 1.26.51.01-ll test copy and installs them into mods/amml (their config/ is kept), moves an old LeviLamina minimap from mods to the sibling folder _disabled-ll-minimap, starts Minecraft.Windows.exe with grade on for the run, waits up to 180 s for the manager to register alaydriem-minimap, ends only the process it started, restores the loader config and prints the loader, minimap and manager lines of the run. Passes when every entry that applies to this build resolves (an entry an entry_is check refuses is not for this build, not missing), the minimap loads with no missing entry, its log has no off, missing, error or panic line and the manager registers it"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the test copies live under %LOCALAPPDATA%/amml/instances"; exit 1; }
game="$LOCALAPPDATA/amml/instances/1.26.51.01-ll"
logs="$game/logs/amml"
manager_logs="$game/logs/amm/alaydriem-mod-manager"
minimap_logs="$game/logs/amm/alaydriem-minimap"
config="$game/mods/amml-loader/amml.hcl"
if [ -d "$game/mods/alaydriem-mod-manager" ]; then echo "the C++ manager is still in mods/alaydriem-mod-manager; run mise run ingame-ll-manager once or move it out first"; exit 1; fi
# an old LeviLamina minimap goes aside inside the instance, so that two minimaps do not run
echo "--- moves"
moved=""
for name in alaydriem-minimap "Alaydriem's Mini Map"; do
  [ -d "$game/mods/$name" ] || continue
  mkdir -p "$game/_disabled-ll-minimap"
  if [ -e "$game/_disabled-ll-minimap/$name" ]; then echo "mods/$name is not moved: _disabled-ll-minimap/$name already exists; sort the two out by hand"; exit 1; fi
  mv "$game/mods/$name" "$game/_disabled-ll-minimap/$name"
  echo "moved mods/$name to _disabled-ll-minimap/$name"
  moved="yes"
done
[ -n "$moved" ] || echo "nothing to move"
. scripts/ingame-mods.sh
build_mods ""
mise run package-ll --game "$game"
install_mods "$game/mods/amml"
saved=""
if [ -f "$config" ]; then saved=$(mktemp); cp "$config" "$saved"; fi
restore() { if [ -n "$saved" ]; then cp "$saved" "$config" && rm -f "$saved" || return 1; else rm -f "$config"; fi; }
. scripts/game-pid.sh
. scripts/ingame-common.sh
game_pid=""
launched=""
trap 'end_game || echo "ending the game failed"; restore || echo "restoring $config failed"' EXIT
printf 'grade = true\n' > "$config"
mkdir -p "$logs" "$manager_logs" "$minimap_logs"
minimap_before=" $(cd "$minimap_logs" && echo *.log) "
loader_start=$(size_of "$logs/loader.log")
manager_amml_start=$(size_of "$logs/alaydriem-mod-manager.log")
minimap_start=$(size_of "$logs/alaydriem-minimap.log")
remember_session_logs "$manager_logs"
before=" $(echo $(game_pids)) "
(cd "$game" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  if session_has '"mod_id":"alaydriem-minimap"'; then outcome="linked"; break; fi
  if [ -z "$game_pid" ]; then find_game_pid "$game"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome (game PID ${game_pid:-none})"
# more time so the first frames and ticks reach the logs
if [ "$outcome" = "linked" ]; then sleep 15; fi
running="no"
if pid_alive; then running="yes"; fi
end_game
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start" | grep -v "resolver note" || true
echo "--- alaydriem-minimap.log (this run)"
since "$logs/alaydriem-minimap.log" "$minimap_start"
minimap_new=""
for path in "$minimap_logs"/*.log; do
  [ -f "$path" ] || continue
  case "$minimap_before" in *" ${path##*/} "*) ;; *) minimap_new="$minimap_new $path"; echo "--- minimap session log (this run): $path"; cat "$path" ;; esac
done
echo "--- alaydriem-mod-manager.log (this run)"
since "$logs/alaydriem-mod-manager.log" "$manager_amml_start"
for path in $(session_logs); do
  echo "--- manager session log (this run): $path"
  cat "$path"
done
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|not for this build|grade: |mod entries|mod loaded|mod switched off|mod could not be loaded" || true
for path in $(session_logs); do grep -E "overlay bound|mod registered" "$path" || true; done
echo "game running before it was ended: $running"
failed=""
since "$logs/loader.log" "$loader_start" | grep -q -E 'resolved ([0-9]+)/\1;' || { echo "FAIL: the loader did not resolve all entries"; failed="yes"; }
# an entry an entry_is check refuses is not for this build (INFO, counted apart); any other unresolved entry is missing
if since "$logs/loader.log" "$loader_start" | grep -q -F "mod entries did not all resolve"; then echo "FAIL: a mod has a missing entry"; failed="yes"; fi
since "$logs/loader.log" "$loader_start" | grep -q -F '"missing":0,"mod_name":"alaydriem-minimap"' || { echo "FAIL: the minimap has a missing entry (features off: not none)"; failed="yes"; }
for mod in alaydriem-mod-manager alaydriem-minimap; do
  since "$logs/loader.log" "$loader_start" | grep -q -F "mod loaded {\"mod_name\":\"$mod\"}" || { echo "FAIL: $mod did not load"; failed="yes"; }
done
if { since "$logs/alaydriem-minimap.log" "$minimap_start"; for path in $minimap_new; do cat "$path"; done; } | grep -q -i -E " is off| is missing|panic|ERROR|WARN"; then echo "FAIL: the minimap log holds an off, missing, error or panic line"; failed="yes"; fi
if since "$logs/loader.log" "$loader_start" | grep -q -i -E "panic| ERROR "; then echo "FAIL: the loader log holds an error or panic line"; failed="yes"; fi
[ -n "$minimap_new" ] || { echo "FAIL: the minimap wrote no session log"; failed="yes"; }
[ "$outcome" = "linked" ] && [ "$running" = "yes" ] && [ -z "$failed" ]
'''

