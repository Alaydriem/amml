# Translation catalogs: each crate that shows text has <crate folder>/i18n/ holding <domain>.pot
# (written from its Message enum), the translators' <locale>.po files, and packs/<locale>.json.

[tasks."i18n:extract"]
description = "Writes each crate's i18n/<domain>.pot from its Message enum"
dir = "{{config_root}}"
# One `cargo run --example i18n_extract` line per crate with a Message enum
run = [
  "cargo run -q -p amml-ui --example i18n_extract",
  "cargo run -q -p amml-studio-ui --example studio_i18n_extract",
]

[tasks."i18n:check"]
description = "Fails when a crate's .pot is out of date with its Message enum"
dir = "{{config_root}}"
# One `cargo run --example i18n_extract -- --check` line per crate with a Message enum
run = [
  "cargo run -q -p amml-ui --example i18n_extract -- --check",
  "cargo run -q -p amml-studio-ui --example studio_i18n_extract -- --check",
]

[tasks."i18n:build"]
description = "Compiles each crate's i18n/<locale>.po into i18n/packs/<locale>.json; a locale under 90 % coverage is not shipped"
dir = "{{config_root}}"
shell = "bash -c"
run = 'for dir in ui/*/i18n i18n/*/i18n; do [ -d "$dir" ] || continue; cargo run -q -p amml-i18n-tool -- build "$dir" "$dir/packs" || exit 1; done'

[tasks."i18n:pseudo"]
description = "Writes the en_XA pseudo-locale pack of each crate's .pot into i18n/packs/en_XA.json"
dir = "{{config_root}}"
shell = "bash -c"
run = 'for pot in ui/*/i18n/*.pot i18n/*/i18n/*.pot; do [ -f "$pot" ] || continue; cargo run -q -p amml-i18n-tool -- pseudo "$pot" "$(dirname "$pot")/packs/en_XA.json" || exit 1; done'

[tasks."i18n:report"]
description = "Prints the translation coverage of each crate's locales against its .pot"
dir = "{{config_root}}"
shell = "bash -c"
run = 'for pot in ui/*/i18n/*.pot i18n/*/i18n/*.pot; do [ -f "$pot" ] || continue; echo "## $pot"; cargo run -q -p amml-i18n-tool -- report "$pot" "$(dirname "$pot")" || exit 1; done'

