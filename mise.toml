dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--game <game>" help="Not used; the private instance is a copy made once from 1.26.60.05-standalone"
flag "--instance <instance>" help="The private instance to run; only 1.26.60.05-locator-heads is accepted"
'''
run = "bash scripts/ingame-standalone-locator-heads.sh"

[tasks.ingame-peek]
description = "Runs the peek in-game gate in the private instance 1.26.60.05-peek (a copy of 1.26.60.05-standalone; no other instance is used): builds the loader and installs it with the chosen mod (--mod testmod|peek), keeps only the copied mod manager beside it and removes any other mod, copies recipes/ into its amml/recipes, starts its Minecraft.Windows.exe, records the game PID in pids.md, waits up to 180 s for the ready line (ticks=100 for the test mod, the manager registering alaydriem-peek for peek), optionally holds the game for --hold seconds for a manual check, ends only that PID and checks that it is gone, and prints the loader, manager and mod lines of the run. It does not run scripts/ingame-mods.sh. Passes when all entries resolve, the mod has no missing entry and no off, missing, error or panic line, and the game ran until it was ended"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--mod <mod>" help="The mod to run: testmod or peek"
flag "--hold <seconds>" help="Keep the game running this long after the automated checks, for a manual check; default 0"
flag "--with <mod>" help="One more mod repo beside amml to package and keep installed with peek, for a check of the two together: freecam"
'''
run = "bash scripts/ingame-peek.sh"

[tasks.install]
description = "Builds release amml.dll and amml-patch, patches Minecraft.Windows.exe from Minecraft.Windows.exe.bak of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, required), copies amml.dll, the recipes and the data next to it, and marks the AMML as a local build (amml/amml-version.txt = <version>+local, amml/amml-api.txt). Close the game first: a running game locks the DLL"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" required=#true help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
game="$LOCALAPPDATA/amml/instances/${usage_instance:?--instance is required}"
cargo build --release -p amml-loader -p amml-patch
if [ ! -f "$game/Minecraft.Windows.exe.bak" ]; then
  echo "missing $game/Minecraft.Windows.exe.bak" >&2
  exit 1
fi
target/release/amml-patch.exe --input "$game/Minecraft.Windows.exe.bak" --output "$game/Minecraft.Windows.exe"
cp target/release/amml.dll "$game/amml.dll"
rm -rf "$game/amml/recipes"
mkdir -p "$game/amml/cache" "$game/mods/amml"
cp -r recipes "$game/amml/recipes"
rm -rf "$game/amml/data"
mkdir -p "$game/amml/data"
cp data/*.hcl "$game/amml/data/"
# amml-loader takes the workspace version; `+local` tells the launcher this AMML is not a core release
version="$(sed -nE '/^\[workspace\.package\]/,/^\[/{s/^version *= *"([^"]+)".*/\1/p}' Cargo.toml)"
api="$(sed -nE 's/^pub const AMML_API_VERSION: u32 = ([0-9]+);.*/\1/p' loader/abi/src/amml_api.rs)"
if [ -z "$version" ] || [ -z "$api" ]; then
  echo "the workspace version or AMML_API_VERSION was not found" >&2
  exit 1
fi
printf '%s+local' "$version" > "$game/amml/amml-version.txt"
printf '%s' "$api" > "$game/amml/amml-api.txt"
echo "installed loader $version+local (API $api) into $game"
'''

