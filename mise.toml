usage = '''
flag "--from <from>" default="26.63.90" help="Version to install"
flag "--to <to>" default="26.63.91" help="Version to update to"
flag "--port <port>" default="8765" help="Local server port"
'''
run = '''bash scripts/update-loop.sh "$usage_from" "$usage_to" "$usage_port"'''

[tasks."launcher-app:i18n-extract"]
description = "Writes launcher/app/i18n/amml-launcher.pot from every I18n call in launcher/app/src"
dir = "{{config_root}}/launcher/app"
run = "node --disable-warning=ExperimentalWarning scripts/i18n/extract.mjs"

[tasks."launcher-app:i18n-check"]
description = "Fails when launcher/app/i18n/amml-launcher.pot is out of date"
dir = "{{config_root}}/launcher/app"
run = "node --disable-warning=ExperimentalWarning scripts/i18n/extract.mjs --check"

[tasks."launcher-app:i18n-build"]
description = "Compiles the shipped .po files and writes the en_XA pseudo pack into launcher/app/src-tauri/resources/i18n"
dir = "{{config_root}}/launcher/app"
run = [
  "cargo run -q -p amml-i18n-tool -- build i18n src-tauri/resources/i18n",
  "cargo run -q -p amml-i18n-tool -- pseudo i18n/amml-launcher.pot src-tauri/resources/i18n/en_XA.json",
]

[tasks.package-release]
description = "Builds release amml.dll and amml-patch and writes amml-<version>-windows-x64.zip, SHA256SUMS.txt and release-meta.env in the repo root: mise run package-release -- --version <v> --game-versions <comma list>"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--version <version>" help="Release version, Cargo semver (26.60.5)"
flag "--game-versions <game_versions>" help="Tested game versions, comma separated (1.26.60.5)"
'''
run = 'bash scripts/package-release.sh "${usage_version:-}" "${usage_game_versions:-}"'

[tasks.set-version]
description = "Writes the release version into Cargo.toml and Cargo.lock and checks that every workspace crate has it: mise run set-version -- <version>"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
arg "<version>" help="Release version, Cargo semver (26.60.5)"
'''
run = 'bash scripts/set-version.sh "${usage_version:-}"'

[tasks.build-lib]
description = "Builds the release amml.dll and amml-patch.exe into target/release"
dir = "{{config_root}}"
run = "cargo build --release -p amml-loader -p amml-patch"

[tasks.build-folder-trace]
description = "Builds the release loader with the folder-trace feature (it logs every folder request the game makes) and copies it to target/operator/amml-folder-trace.dll; never ships"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p amml-loader --features folder-trace
mkdir -p target/operator
cp target/release/amml.dll target/operator/amml-folder-trace.dll
echo "built target/operator/amml-folder-trace.dll"
'''

[tasks.build-registry]
description = "Builds the amml-registry CLI (release): the registry publish workflow and the mod release lint run target/release/amml-registry"
dir = "{{config_root}}"
run = "cargo build --release -p amml-registry"

[tasks.gdk]
description = "The Store-route installer CLI: gdk list [--preview], install <version> [--preview], instance <version> <name>, seed <instance dir>, recover, status"
dir = "{{config_root}}"
run = "cargo run --release -p amml-gdk --"

[tasks.launcher]
description = "The launcher core CLI: registry, instance, amml, mod, updates, data, launch and settings commands (amml-launcher --help)"
dir = "{{config_root}}"
run = "cargo run --release -p amml-launcher-core --bin amml-launcher --"
