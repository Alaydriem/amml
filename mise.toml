[tools]
# ingame-ll-manager reads the LeviLamina manifests with it
jq = "1.8.1"

[tasks.preflight]
description = "Names a missing cargo, cargo-nextest or pinned toolchain before a build turns it into an obscure error"
dir = "{{config_root}}"
run = ["rustc --version", "cargo --version", "cargo nextest --version", "cargo build -p amml-msvc-fixture"]

[tasks.check]
description = "cargo fmt check, cargo check and clippy with warnings denied over the workspace"
dir = "{{config_root}}"
run = [
  "cargo fmt --all --check",
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.test]
description = "Every workspace test through cargo-nextest, then the doctests that nextest skips (the compile_fail checks that widgets take Text, not &str)"
dir = "{{config_root}}"
run = [
  "cargo nextest run --workspace --no-tests=pass",
  "cargo test --doc -p amml-i18n -p amml-ui -p amml-studio-ui -p amml-game",
]

[tasks.proof-old-loader]
description = "On demand, not part of `test`: builds the released 26.60.5 loader in a git worktree under target/proof-old-loader and proves it skips a mod folder with amml_version (unknown attribute), the fail-safe the registry floor 26.60.6 relies on; prints PROOF-OLD-LOADER-REFUSES from inside the passing test and fails on a failed build"
dir = "{{config_root}}"
shell = "bash -c"
run = "bash scripts/proof-old-loader.sh"

[tasks.registry-proof]
description = "Copies the tracked files of the sibling ../amml-registry checkout (git archive HEAD) to target/registry-proof, runs build-tree on the copy and diffs it byte for byte; prints registry-proof: identical or exits 1; AMML_REGISTRY_DIR overrides the checkout"
dir = "{{config_root}}"
shell = "bash -c"
run = "bash scripts/registry-proof.sh"

[tasks.derive]
description = "Derives the address data of one game build: --exe, --recipes, --out, --report, optional --compare and --jobs <dir>"
dir = "{{config_root}}"
run = "cargo run -p amml-derive --release -- derive"

[tasks.derive-check]
description = "Derives one exe in full (--full) into a temp folder and compares the result byte for byte with data/<build>.hcl: --exe; exits 1 and prints both paths when they differ"
dir = "{{config_root}}"
shell = "bash -c"
usage = 'flag "--exe <exe>" help="The game executable to derive"'
run = '''
set -e
exe="${usage_exe:?--exe is required}"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
cargo run -p amml-derive --release -- derive --full --exe "$exe" --recipes recipes --out "$tmp/data" --report "$tmp/reports"
for fresh in "$tmp"/data/*.hcl; do
  committed="data/$(basename "$fresh")"
  if [ ! -f "$committed" ]; then
    echo "derive-check: no committed file: $committed"
    exit 1
  fi
  if ! cmp -s "$fresh" "$committed"; then
    echo "derive-check: differs: $fresh $committed"
    exit 1
  fi
  echo "derive-check: identical: $committed"
done
'''

[tasks.lint]
description = "Lists the open findings of every recipe on one exe: fixed bytes in immediates, displacements or branch offsets, recipes that did not run, matches it cannot decode, literal vtable slots on function entries and narrow range windows: --exe, optional --recipes (default recipes) and --report; exits 1 on findings"
dir = "{{config_root}}"
run = "cargo run -p amml-derive --release -- lint"

[tasks.signature]
description = "Lists the argument registers, stack arguments and return kind of every hooked function: --exe, optional --recipes (default recipes), --out and --compare <other signature file>; with --compare prints same, changed or unknown per entry and exits 1 on any changed or unknown"
dir = "{{config_root}}"
run = "cargo run -p amml-derive --release -- signature"

[tasks.inspect]
description = "Read-only views of one game executable with --exe: scan, function, disasm, vtable (--names), xrefs, callers, draft, explain, similar, fields, packets, build-id; inspect <op> --help shows the arguments"
dir = "{{config_root}}"
run = "cargo run -p amml-derive --release -- inspect"

[tasks.decompile]
description = "Decompiles one function with Ghidra headless: --exe, --rva (hex), optional --out; imports the exe once per BuildId into %LOCALAPPDATA%/amml/ghidra"
dir = "{{config_root}}"
run = "pwsh -NoProfile -File scripts/ghidra-decompile.ps1"

[tasks.repair-sandbox]
description = "Copies the repo into %LOCALAPPDATA%/amml/repair-sandbox/<name> for a timed repair test: --name, --recipes, optional --hide-key and --hide-ids (leak check), --force"
dir = "{{config_root}}"
run = "pwsh -NoProfile -File scripts/repair-sandbox.ps1"

[tasks.install-skill]
description = "Links .claude/skills/amml-repair to skill/amml-repair (a directory junction on Windows) so Claude Code finds the repair skill; safe to run again"
dir = "{{config_root}}"
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$target = (Resolve-Path -LiteralPath 'skill/amml-repair').Path.TrimEnd([char]92)
$link = Join-Path (Get-Location).Path '.claude/skills/amml-repair'
New-Item -ItemType Directory -Force -Path (Split-Path -Parent $link) | Out-Null
if (Test-Path -LiteralPath $link) {
  $item = Get-Item -LiteralPath $link -Force
  $now = if ($item.LinkType) { [System.IO.Path]::GetFullPath(([string]$item.Target).Replace('\??\', '')).TrimEnd([char]92) } else { $null }
  if ($now -eq $target) { Write-Output "already linked: $link -> $target"; exit 0 }
  [Console]::Error.WriteLine("$link exists and is not a link to $target; remove it by hand"); exit 1
}
if ($IsWindows) {
  cmd /c mklink /J "$link" "$target" | Out-Null
  if ($LASTEXITCODE -ne 0) { throw "mklink /J failed with exit code $LASTEXITCODE" }
} else {
  New-Item -ItemType SymbolicLink -Path $link -Target $target | Out-Null
}
Write-Output "linked: $link -> $target"
'''

[tasks.derive-smoke]
description = "Derives the smoke recipes into data/smoke and reports/smoke; AMML_GAME_EXE overrides the default 1.26.51.01-ll original"
dir = "{{config_root}}"
run = "cargo run -p amml-derive --release -- derive --exe \"{{ get_env(name='AMML_GAME_EXE', default=env.LOCALAPPDATA ~ '/amml/instances/1.26.51.01-ll/Minecraft.Windows.exe.orig') }}\" --recipes fixtures/smoke-recipes --out data/smoke --report reports/smoke"

[tasks.game-test-patch]
description = "Patches the pristine 1.26.51.01-ll executable into a temp folder and checks its BuildId and imports; AMML_GAME_EXE overrides the default .bak"
dir = "{{config_root}}"
env = { AMML_GAME_EXE = "{{ get_env(name='AMML_GAME_EXE', default=env.LOCALAPPDATA ~ '/amml/instances/1.26.51.01-ll/Minecraft.Windows.exe.bak') }}" }
run = "cargo nextest run -p amml-patch --release --run-ignored only --test game --no-capture"

[tasks.game-test]
description = "Derives the smoke recipes on a real game executable and compares them with data/smoke, then runs game-test-patch; AMML_GAME_EXE overrides the default 1.26.51.01-ll original"
dir = "{{config_root}}"
depends = ["game-test-patch"]
env = { AMML_GAME_EXE = "{{ get_env(name='AMML_GAME_EXE', default=env.LOCALAPPDATA ~ '/amml/instances/1.26.51.01-ll/Minecraft.Windows.exe.orig') }}" }
run = "cargo nextest run -p amml-derive --release --run-ignored only --test game --no-capture"

[tasks.package-ll]
description = "Builds release amml.dll and copies the LeviLamina package into <game>/mods/amml-loader: --game, default %LOCALAPPDATA%/amml/instances/1.26.51.01-ll"
dir = "{{config_root}}"
shell = "bash -c"
usage = 'flag "--game <game>" help="The game folder that holds Minecraft.Windows.exe"'
run = '''
set -e
game="${usage_game:-$LOCALAPPDATA/amml/instances/1.26.51.01-ll}"
target="$game/mods/amml-loader"
cargo build -p amml-loader --release
mkdir -p "$target/cache"
cp target/release/amml.dll "$target/amml.dll"
cp loader/dll/packaging/ll/manifest.json "$target/manifest.json"
rm -rf "$target/recipes"
cp -r recipes "$target/recipes"
rm -rf "$target/data"
mkdir -p "$target/data"
cp data/*.hcl "$target/data/"
echo "packaged into $target"
'''

[tasks.package-testmod]
description = "Builds release amml_testmod.dll and copies it with its amml.hcl into <game>/mods/amml/@amml/testmod: --game, default %LOCALAPPDATA%/amml/instances/1.26.51.01-ll"
dir = "{{config_root}}"
shell = "bash -c"
usage = 'flag "--game <game>" help="The game folder that holds Minecraft.Windows.exe"'
run = '''
set -e
game="${usage_game:-$LOCALAPPDATA/amml/instances/1.26.51.01-ll}"
target="$game/mods/amml/@amml/testmod"
cargo build -p amml-testmod --release
mkdir -p "$target"
cp target/release/amml_testmod.dll "$target/amml_testmod.dll"
cp loader/testmod/packaging/amml.hcl "$target/amml.hcl"
echo "packaged into $target"
'''

[tasks.ingame-ll]
description = "Builds every AMML mod in its own repo (manager, minimap, levels, freecam, zoom and stratum) and installs all of them into mods/amml, and fails on a failed build or an installed DLL older than a source file it is built from (scripts/ingame-mods.sh). Packages the loader and the test mod into the 1.26.51.01-ll test copy, starts Minecraft.Windows.exe with grade on for the run, waits up to 180 s for ticks=100, ends only the process it started, restores the loader config, removes the test mod again unless it was there before and prints the coverage, heap, grade and ticks lines"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
game="$LOCALAPPDATA/amml/instances/1.26.51.01-ll"
logs="$game/logs/amml"
config="$game/mods/amml-loader/amml.hcl"
. scripts/ingame-mods.sh
build_mods ""
mise run package-ll --game "$game"
install_mods "$game/mods/amml"
testmod="$game/mods/amml/@amml/testmod"
testmod_existed=""
if [ -d "$testmod" ]; then testmod_existed="yes"; fi
mise run package-testmod --game "$game"
saved=""
if [ -f "$config" ]; then saved=$(mktemp); cp "$config" "$saved"; fi
restore() { if [ -n "$saved" ]; then cp "$saved" "$config" && rm -f "$saved" || return 1; else rm -f "$config"; fi; }
printf 'grade = true\n' > "$config"
mkdir -p "$logs"
. scripts/ingame-common.sh
loader_start=$(size_of "$logs/loader.log")
testmod_start=$(size_of "$logs/@amml/testmod.log")
. scripts/game-pid.sh
before=" $(echo $(game_pids)) "
game_pid=""
launched=""
# removes the test mod again unless it was installed before this run
remove_testmod() { if [ -z "$testmod_existed" ]; then rm -rf "$testmod"; fi; }
trap 'end_game; restore; remove_testmod' EXIT
(cd "$game" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  if since "$logs/@amml/testmod.log" "$testmod_start" | grep -q "ticks=100"; then outcome="ticks"; break; fi
  if [ -z "$game_pid" ]; then find_game_pid "$game"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome"
end_game
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start"
echo "--- @amml/testmod.log (this run)"
since "$logs/@amml/testmod.log" "$testmod_start"
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|game heap|grade: " || true
since "$logs/@amml/testmod.log" "$testmod_start" | grep "ticks=" || true
heap="no"
if since "$logs/loader.log" "$loader_start" | grep -q "game heap ok"; then heap="yes"; fi
echo "game heap ok: $heap"
[ "$outcome" = "ticks" ] && [ "$heap" = "yes" ]
'''

[tasks.make-standalone-instance]
description = "Copies the 1.26.51.01-ll test copy to 1.26.51.01-standalone without LeviLamina files (mods, mods-disabled, ll_data, logs, bedrock_runtime_data, PreLoader, LeviLauncher, tooth_lock.json, PeEditor.exe) (skips files with the same size and time), writes the patched exe from the pristine .bak, and installs amml.dll, the recipes and mods/amml: --game, --instance"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--game <game>" help="The LeviLamina game folder to copy from; default %LOCALAPPDATA%/amml/instances/1.26.51.01-ll"
flag "--instance <instance>" help="The standalone folder to write; default %LOCALAPPDATA%/amml/instances/1.26.51.01-standalone"
'''
run = '''
set -e
game="${usage_game:-$LOCALAPPDATA/amml/instances/1.26.51.01-ll}"
instance="${usage_instance:-$LOCALAPPDATA/amml/instances/1.26.51.01-standalone}"
cargo build -p amml-loader -p amml-patch --release
mkdir -p "$instance"
# robocopy skips files with the same size and time; exit codes below 8 are success
rc=0
robocopy "$(cygpath -w "$game")" "$(cygpath -w "$instance")" //E //NFL //NDL //NJH //NJS //NP \
  //XD "$(cygpath -w "$game/mods")" "$(cygpath -w "$game/mods-disabled")" "$(cygpath -w "$game/ll_data")" \
    "$(cygpath -w "$game/bedrock_runtime_data")" "$(cygpath -w "$game/logs")" \
  //XF PreLoader.dll LeviLauncher.dll PreLoaderConfig.json tooth_lock.json PeEditor.exe bedrock_runtime_data Minecraft.Windows.exe Minecraft.Windows.exe.bak Minecraft.Windows.exe.orig \
  || rc=$?
[ "$rc" -lt 8 ]
# bedrock_runtime_data is a file in 26.51 and a folder in other builds; the rest are LeviLamina
# files that an older copy of this instance may still hold
rm -rf "$instance/bedrock_runtime_data" "$instance/ll_data" "$instance/mods-disabled" "$instance/tooth_lock.json" "$instance/PeEditor.exe"
target/release/amml-patch.exe --input "$game/Minecraft.Windows.exe.bak" --output "$instance/Minecraft.Windows.exe"
cp target/release/amml.dll "$instance/amml.dll"
rm -rf "$instance/amml/recipes"
mkdir -p "$instance/amml"
cp -r recipes "$instance/amml/recipes"
rm -rf "$instance/amml/data"
mkdir -p "$instance/amml/data"
cp data/*.hcl "$instance/amml/data/"
if [ -d "$game/mods/amml" ]; then
  mkdir -p "$instance/mods"
  rm -rf "$instance/mods/amml"
  cp -r "$game/mods/amml" "$instance/mods/amml"
fi
echo "standalone instance ready at $instance"
'''

[tasks.ingame-standalone]
