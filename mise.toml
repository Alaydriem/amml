[tasks.ingame-mods-test]
description = "Checks the stale-DLL check of scripts/ingame-mods.sh on a fake mod repo in a temporary folder: a DLL newer than its sources installs; a newer source (also one with a space in its path) or a missing dep-info file fails. No build and no game"
dir = "{{config_root}}"
run = "bash scripts/ingame-mods-test.sh"

[tasks.ingame-ll-moves-test]
description = "Checks the all-or-nothing move of the old LeviLamina stratum (scripts/ingame-ll-moves.sh) on a fake game folder in a temporary folder: the DLL, PDB and manifest.json move and the config and data folders stay; a target that already exists moves nothing; a file that cannot move sends the files moved before it back. No build and no game"
dir = "{{config_root}}"
run = "bash scripts/ingame-ll-moves-test.sh"

[tasks.ingame-ll-stratum]
description = "Builds every AMML mod in its own repo (manager, minimap, levels, freecam, zoom, and stratum with --features), packages the loader into the 1.26.51.01-ll test copy and installs them into mods/amml (their config/ is kept), moves old LeviLamina builds to _disabled-ll-mods (of the old stratum only its DLL, PDB and manifest.json, all or nothing; its config and data folders stay for the one-time copy), starts the game with grade on and waits up to 180 s for stratum to enable. With --features gate it enters the first world of the Play list through LeviHeadlessInput (background mode, no foreground), waits up to 150 s for the gate's 600 drawn frames, saves a third-person screenshot to --shot, closes the game window and waits up to 60 s for the game to exit. Ends only the process it started and restores the loader and LeviHeadlessInput configs. Passes when every entry resolves, every mod loads, stratum logs 'features off: none' and no off, missing, error or panic line, and with the gate: a valid mesh with vertices, 'gate nbt kind=Exact name=minecraft:oak_stairs', 600 drawn frames and a clean exit"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--features <features>" help="Cargo features of stratum-amml, comma separated (gate runs the in-game gate)"
flag "--shot <shot>" help="Where the gate run saves its screenshot (PNG)"
'''
run = "bash scripts/ingame-ll-stratum.sh"

[tasks.ingame-standalone-stratum]
description = "As ingame-ll-stratum on the standalone host: builds every AMML mod (stratum with --features), refreshes a standalone instance (--instance, default 1.26.51.01-standalone) from a game copy (--game, default 1.26.51.01-ll), installs the mods into its mods/amml, starts it and waits up to 180 s for stratum to enable. With --features gate it tries the world entry with clicks posted to the game window (LeviHeadlessInput needs LeviLamina), waits up to 150 s for the gate's 600 drawn frames, closes the game window and waits up to 60 s for the exit. Ends only the process it started. Passes as ingame-ll-stratum does; when the posted clicks do not enter a world it says so and the gate lines are not checked"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--features <features>" help="Cargo features of stratum-amml, comma separated (gate runs the in-game gate)"
flag "--game <game>" help="The game copy the standalone instance is made from"
flag "--instance <instance>" help="The standalone instance to run"
'''
run = "bash scripts/ingame-standalone-stratum.sh"

[tasks.ingame-ll-dejavu]
description = "Runs the mod build of the stratum tasks (scripts/ingame-mods.sh), which builds and installs DejaVu too (DEJAVU_REPO defaults to ../dejavu; DEJAVU_DIST defaults to $DEJAVU_REPO/dist/alaydriem-dejavu), and fails with a clear message when alaydriem_dejavu.dll or amml.hcl is missing from the package. Packages the loader into the 1.26.51.01-ll test copy and installs all mods and DejaVu into mods/amml, moves the DLL, PDB and manifest.json of an old LeviLamina mods/DejaVu to the sibling folder _disabled-ll-dejavu (its config and data folders stay for the one-time copy; all or nothing), starts Minecraft.Windows.exe with grade on for the run, waits up to 180 s for DejaVu to log 'features off:', ends only the process it started, restores the loader config and prints the loader and DejaVu lines of the run. Passes when every entry resolves, the manager and DejaVu load, DejaVu has no missing entry, its log holds 'features off: none' and no off, missing, error or panic line"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the test copies live under %LOCALAPPDATA%/amml/instances"; exit 1; }
game="$LOCALAPPDATA/amml/instances/1.26.51.01-ll"
logs="$game/logs/amml"
config="$game/mods/amml-loader/amml.hcl"
if [ -d "$game/mods/alaydriem-mod-manager" ]; then echo "the C++ manager is still in mods/alaydriem-mod-manager; run mise run ingame-ll-manager once or move it out first"; exit 1; fi
. scripts/ingame-mods.sh
build_mods ""
dejavu_repo="${DEJAVU_REPO:-../dejavu}"
dejavu_dist="${DEJAVU_DIST:-$dejavu_repo/dist/alaydriem-dejavu}"
[ -f "$dejavu_dist/alaydriem_dejavu.dll" ] && [ -f "$dejavu_dist/amml.hcl" ] || { echo "FAIL: no DejaVu package in $dejavu_dist (needs alaydriem_dejavu.dll and amml.hcl; set DEJAVU_DIST when the package task writes elsewhere)"; exit 1; }
# an old LeviLamina DejaVu goes aside inside the instance, so that two DejaVus do not run; only its code files move, all or nothing
echo "--- moves"
old="$game/mods/DejaVu"
aside="$game/_disabled-ll-dejavu/DejaVu"
if [ -d "$old" ]; then
  files=""
  for path in "$old"/*.dll "$old"/*.pdb "$old/manifest.json"; do [ -f "$path" ] && files="$files $path"; done
  if [ -e "$aside" ]; then echo "mods/DejaVu is not moved: _disabled-ll-dejavu/DejaVu already exists; sort the two out by hand"; exit 1; fi
  mkdir -p "$aside"
  for path in $files; do mv "$path" "$aside/"; done
  echo "moved the code files of mods/DejaVu to _disabled-ll-dejavu/DejaVu"
else
  echo "nothing to move"
fi
mise run package-ll --game "$game"
install_mods "$game/mods/amml"
saved=""
if [ -f "$config" ]; then saved=$(mktemp); cp "$config" "$saved"; fi
restore() { if [ -n "$saved" ]; then cp "$saved" "$config" && rm -f "$saved" || return 1; else rm -f "$config"; fi; }
. scripts/game-pid.sh
. scripts/ingame-common.sh
game_pid=""
launched=""
trap 'end_game || echo "ending the game failed"; restore || echo "restoring $config failed"' EXIT
printf 'grade = true\n' > "$config"
mkdir -p "$logs"
loader_start=$(size_of "$logs/loader.log")
dejavu_start=$(size_of "$logs/alaydriem-dejavu.log")
before=" $(echo $(game_pids)) "
(cd "$game" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  if since "$logs/alaydriem-dejavu.log" "$dejavu_start" | grep -q -F "features off:"; then outcome="enabled"; break; fi
  if [ -z "$game_pid" ]; then find_game_pid "$game"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome (game PID ${game_pid:-none})"
if [ "$outcome" = "enabled" ]; then sleep 15; fi
running="no"
if pid_alive; then running="yes"; fi
end_game
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start" | grep -v "resolver note" || true
echo "--- alaydriem-dejavu.log (this run)"
since "$logs/alaydriem-dejavu.log" "$dejavu_start"
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|not for this build|grade: |mod entries|mod loaded|mod switched off|mod could not be loaded" || true
echo "game running before it was ended: $running"
failed=""
since "$logs/loader.log" "$loader_start" | grep -q -E 'resolved ([0-9]+)/\1;' || { echo "FAIL: the loader did not resolve all entries"; failed="yes"; }
if since "$logs/loader.log" "$loader_start" | grep -q -F "mod entries did not all resolve"; then echo "FAIL: a mod has a missing entry"; failed="yes"; fi
since "$logs/loader.log" "$loader_start" | grep -q -F '"missing":0,"mod_name":"alaydriem-dejavu"' || { echo "FAIL: DejaVu has a missing entry"; failed="yes"; }
for mod in alaydriem-mod-manager alaydriem-dejavu; do
  since "$logs/loader.log" "$loader_start" | grep -q -F "mod loaded {\"mod_name\":\"$mod\"}" || { echo "FAIL: $mod did not load"; failed="yes"; }
done
since "$logs/alaydriem-dejavu.log" "$dejavu_start" | grep -q -F "features off: none" || { echo "FAIL: the DejaVu log has no 'features off: none' line"; failed="yes"; }
if since "$logs/alaydriem-dejavu.log" "$dejavu_start" | grep -q -i -E " is off| is missing|panic|ERROR"; then echo "FAIL: the DejaVu log holds an off, missing, error or panic line"; failed="yes"; fi
if since "$logs/loader.log" "$loader_start" | grep -q -i -E "panic| ERROR "; then echo "FAIL: the loader log holds an error or panic line"; failed="yes"; fi
[ "$outcome" = "enabled" ] && [ "$running" = "yes" ] && [ -z "$failed" ]
'''

[tasks.ingame-standalone-dejavu]
description = "As ingame-ll-dejavu on the standalone host: runs the mod build of the stratum tasks, which builds and installs DejaVu through scripts/ingame-mods.sh (DEJAVU_REPO defaults to ../dejavu; DEJAVU_DIST defaults to $DEJAVU_REPO/dist/alaydriem-dejavu), and fails with a clear message when the package is missing, refreshes a standalone instance (--instance, default 1.26.51.01-standalone) from a game copy (--game, default 1.26.51.01-ll; use 1.26.60.05 with 1.26.60.05-standalone for 26.60), installs all mods, DejaVu included, into its mods/amml, starts its patched Minecraft.Windows.exe, waits up to 180 s for DejaVu to log 'features off:', ends only the process it started and prints the loader and DejaVu lines of the run. Passes as ingame-ll-dejavu does"
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--game <game>" help="The game copy the standalone instance is made from"
flag "--instance <instance>" help="The standalone instance to run"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the test copies live under %LOCALAPPDATA%/amml/instances"; exit 1; }
game="${usage_game:-$LOCALAPPDATA/amml/instances/1.26.51.01-ll}"
instance="${usage_instance:-$LOCALAPPDATA/amml/instances/1.26.51.01-standalone}"
logs="$instance/amml/logs"
. scripts/ingame-mods.sh
build_mods ""
dejavu_repo="${DEJAVU_REPO:-../dejavu}"
dejavu_dist="${DEJAVU_DIST:-$dejavu_repo/dist/alaydriem-dejavu}"
[ -f "$dejavu_dist/alaydriem_dejavu.dll" ] && [ -f "$dejavu_dist/amml.hcl" ] || { echo "FAIL: no DejaVu package in $dejavu_dist (needs alaydriem_dejavu.dll and amml.hcl; set DEJAVU_DIST when the package task writes elsewhere)"; exit 1; }
mise run make-standalone-instance --game "$game" --instance "$instance"
install_mods "$instance/mods/amml"
. scripts/game-pid.sh
. scripts/ingame-common.sh
game_pid=""
launched=""
trap 'end_game || echo "ending the game failed"' EXIT
mkdir -p "$logs"
loader_start=$(size_of "$logs/loader.log")
dejavu_start=$(size_of "$logs/alaydriem-dejavu.log")
before=" $(echo $(game_pids)) "
(cd "$instance" && ./Minecraft.Windows.exe > /dev/null 2>&1) &
launcher=$!
launched="yes"
started=$(date +%s)
outcome="timeout"
while [ $(( $(date +%s) - started )) -lt 180 ]; do
  if since "$logs/alaydriem-dejavu.log" "$dejavu_start" | grep -q -F "features off:"; then outcome="enabled"; break; fi
  if [ -z "$game_pid" ]; then find_game_pid "$instance"; elif ! pid_alive; then outcome="game exited"; game_pid=""; break; fi
  if [ -z "$game_pid" ] && [ $(( $(date +%s) - started )) -ge 30 ]; then outcome="game did not start"; break; fi
  sleep 2
done
echo "waited $(( $(date +%s) - started )) s: $outcome (game PID ${game_pid:-none})"
if [ "$outcome" = "enabled" ]; then sleep 15; fi
running="no"
if pid_alive; then running="yes"; fi
end_game
echo "--- loader.log (this run)"
since "$logs/loader.log" "$loader_start" | grep -v "resolver note" || true
echo "--- alaydriem-dejavu.log (this run)"
since "$logs/alaydriem-dejavu.log" "$dejavu_start"
echo "--- summary"
since "$logs/loader.log" "$loader_start" | grep -E "resolved [0-9]+/[0-9]+|not for this build|mod entries|mod loaded|mod switched off|mod could not be loaded" || true
echo "game running before it was ended: $running"
failed=""
since "$logs/loader.log" "$loader_start" | grep -q -E 'resolved ([0-9]+)/\1;' || { echo "FAIL: the loader did not resolve all entries"; failed="yes"; }
if since "$logs/loader.log" "$loader_start" | grep -q -F "mod entries did not all resolve"; then echo "FAIL: a mod has a missing entry"; failed="yes"; fi
since "$logs/loader.log" "$loader_start" | grep -q -F '"missing":0,"mod_name":"alaydriem-dejavu"' || { echo "FAIL: DejaVu has a missing entry"; failed="yes"; }
for mod in alaydriem-mod-manager alaydriem-dejavu; do
  since "$logs/loader.log" "$loader_start" | grep -q -F "mod loaded {\"mod_name\":\"$mod\"}" || { echo "FAIL: $mod did not load"; failed="yes"; }
done
since "$logs/alaydriem-dejavu.log" "$dejavu_start" | grep -q -F "features off: none" || { echo "FAIL: the DejaVu log has no 'features off: none' line"; failed="yes"; }
if since "$logs/alaydriem-dejavu.log" "$dejavu_start" | grep -q -i -E " is off| is missing|panic|ERROR"; then echo "FAIL: the DejaVu log holds an off, missing, error or panic line"; failed="yes"; fi
if since "$logs/loader.log" "$loader_start" | grep -q -i -E "panic| ERROR "; then echo "FAIL: the loader log holds an error or panic line"; failed="yes"; fi
[ "$outcome" = "enabled" ] && [ "$running" = "yes" ] && [ -z "$failed" ]
'''

