[tasks."launcher-app:update-loop"]
description = "Local self-update test: builds two signed launcher bundles (default 26.63.90 and 26.63.91) that check http://127.0.0.1:<port>/latest.json, copies the older setup exe to update-loop/install/, serves the newer files from update-loop/serve/ (needs TAURI_SIGNING_PRIVATE_KEY and its password)"
