name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ hashFiles('launcher/kit/yarn.lock', 'launcher/app/yarn.lock') }}
          restore-keys: |
            yarn-

      - run: mise run preflight
      - run: mise run check
      - run: mise run test
      - run: mise run launcher-kit:install
      - run: mise run launcher-kit:check
      - run: mise run launcher-kit:test
      - run: mise run launcher-app:install
      - run: mise run launcher-app:check
      - run: mise run launcher-app:test
      - run: mise run launcher-app:i18n-check
      - run: mise run launcher-app:build
