name: Release mod

# Reusable release workflow for one AMML mod repo. A mod repo calls it from its own release.yml.
# The caller needs `permissions: contents: write`.
on:
  workflow_call:
    inputs:
      version:
        description: Release version, 26.<game minor>.<mod patch> (26.60.1); it is also the tag (no v). MAJOR.MINOR picks the AMML series; the patch is the mod's own release counter on that line, not the Minecraft build
        required: true
        type: string
      path:
        description: Folder name of the mod repo (the checkout folder)
        required: true
        type: string
      namespace:
        description: Mod namespace, for dist/@<namespace>/<name>
        required: true
        type: string
      name:
        description: Mod name, for dist/@<namespace>/<name>
        required: true
        type: string
      package_task:
        description: mise task that writes dist/@<namespace>/<name>
        required: false
        type: string
        default: package
      modmanager:
        description: Check out alaydriem/amml-modmanager next to the repo
        required: false
        type: boolean
        default: true
      extra_task:
        description: Optional mise task that runs after the tests and before the package task
        required: false
        type: string
        default: ""
      amml_ref:
        description: amml branch, tag or commit to build against; empty means the highest amml tag in the release's MAJOR.MINOR series
        required: false
        type: string
        default: ""
      modmanager_ref:
        description: amml-modmanager branch, tag or commit; empty means the highest amml-modmanager tag in the release's MAJOR.MINOR series
        required: false
        type: string
        default: ""
      descriptor:
        description: Path from the repo root to descriptor.hcl; empty means none
        required: false
        type: string
        default: ""
      registry:
        description: Publish to the registry. Writes the mod version into amml.hcl, lints the manifest and listing, and notifies the registry. Turn it on once the mod amml.hcl has a listing block and AMML with the listing-aware loader is released
        required: false
        type: boolean
        default: false
      private_repos:
        description: Comma-separated alaydriem repo names that cargo fetches with the GitHub App token; empty means none. The caller also passes its secrets (secrets inherit)
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

# The workspace depends on ../amml (and ../modmanager-amml) by relative path, so the mod repo is checked out into a
# subfolder and the sibling repos next to it.
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/${{ inputs.path }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path }}
    steps:
      - name: Check the version
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::version '$VERSION' is not Cargo semver (for example 26.60.1)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          path: ${{ inputs.path }}

      # A mod release 26.60.x builds against the highest amml and amml-modmanager tags 26.60.N. Pre-release tags are
      # not candidates. A ref the caller passes is used as given.
      - name: Pick the amml and amml-modmanager refs
        id: refs
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ inputs.version }}
          AMML_REF: ${{ inputs.amml_ref }}
          MODMANAGER: ${{ inputs.modmanager }}
          MODMANAGER_REF: ${{ inputs.modmanager_ref }}
        run: |
          set -eu
          core="${VERSION%%-*}"
          series="${core%.*}"
          pick() {
            local repo="$1" given="$2" input="$3" ref
            if [ -n "$given" ]; then
              printf '%s\n' "$given"
              return
            fi
            ref=$(git ls-remote --tags --refs "https://github.com/alaydriem/$repo.git" \
              | sed -n 's#^.*refs/tags/##p' \
              | { grep -E "^${series//./\\.}\.(0|[1-9][0-9]*)$" || true; } \
              | sort -V \
              | tail -n 1)
            if [ -z "$ref" ]; then
              echo "::error::$repo has no release tag $series.N for version $VERSION; release $repo $series.N first or pass $input" >&2
              return 1
            fi
            printf '%s\n' "$ref"
          }
          amml=$(pick amml "$AMML_REF" amml_ref)
          echo "amml ref: $amml"
          echo "amml=$amml" >> "$GITHUB_OUTPUT"
          if [ "$MODMANAGER" = "true" ]; then
            modmanager=$(pick amml-modmanager "$MODMANAGER_REF" modmanager_ref)
            echo "amml-modmanager ref: $modmanager"
            echo "modmanager=$modmanager" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: alaydriem/amml
          ref: ${{ steps.refs.outputs.amml }}
          path: amml

      # The release lint is the amml-registry tool from amml master, so it applies the same listing rules as the
      # registry publish run, whichever amml ref the mod is built against.
      - uses: actions/checkout@v7
        if: ${{ inputs.registry }}
        with:
          repository: alaydriem/amml
          ref: master
          path: amml-tools

      - uses: actions/checkout@v7
        if: ${{ inputs.modmanager }}
        with:
          repository: alaydriem/amml-modmanager
          ref: ${{ steps.refs.outputs.modmanager }}
          path: modmanager-amml

      - name: Get the GitHub App token
        id: app-token
        if: ${{ inputs.private_repos != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: alaydriem
          repositories: ${{ inputs.private_repos }}

      # Only the private repos are rewritten, so public git dependencies are fetched without the token.
      - name: Let cargo fetch the private repos
        if: ${{ inputs.private_repos != '' }}
        working-directory: ${{ github.workspace }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PRIVATE_REPOS: ${{ inputs.private_repos }}
        run: |
          set -eu
          for repo in ${PRIVATE_REPOS//,/ }; do
            git config --global --add "url.https://x-access-token:${APP_TOKEN}@github.com/alaydriem/${repo}.insteadOf" "https://github.com/alaydriem/${repo}"
          done
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Check that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Write the version
        env:
          VERSION: ${{ inputs.version }}
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          set -eu
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          if ! sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -qF "version = \"$VERSION\""; then
            echo "::error::Cargo.toml has no version line in [workspace.package]"
            exit 1
          fi
          if [ -n "$DESCRIPTOR" ]; then
            sed -E -i "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)\".*\"/\1\"$VERSION\"/" "$DESCRIPTOR"
            if ! grep -qE "^[[:space:]]*version[[:space:]]*=[[:space:]]*\"$VERSION\"" "$DESCRIPTOR"; then
              echo "::error::$DESCRIPTOR has no version line"
              exit 1
            fi
          fi

      # Cargo builds against the git tags named in the manifests, not against the checkouts above, so every amml and
      # amml-modmanager git dependency is pointed at the refs this release picked. The manifests are committed with
      # the version. A ref that is not a release tag (a branch or commit the caller passed) leaves the manifests as
      # they are.
      - name: Point the amml dependencies at the release refs
        env:
          AMML: ${{ steps.refs.outputs.amml }}
          MODMANAGER: ${{ steps.refs.outputs.modmanager }}
        run: |
          set -eu
          tag_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          manifests=$(git ls-files '*Cargo.toml' | grep -v '/tests/fixtures/' || true)
          point() {
            local repo="$1" ref="$2" bad
            if ! [[ "$ref" =~ $tag_re ]]; then
              echo "::notice::$repo ref '$ref' is not a release tag; its git dependencies are left as they are"
              return 0
            fi
            for m in $manifests; do
              sed -E -i "s#(github\.com/[Aa]laydriem/$repo\.git\"[^}]*tag[[:space:]]*=[[:space:]]*\")[^\"]*\"#\1$ref\"#" "$m"
            done
            bad=$(grep -nE "github\.com/[Aa]laydriem/$repo\.git\"" $manifests | grep -vF "tag = \"$ref\"" || true)
            if [ -n "$bad" ]; then
              echo "::error::these $repo dependencies do not name tag $ref:"
              echo "$bad"
              return 1
            fi
            echo "$repo dependencies point at $ref"
          }
          point amml "$AMML"
          if [ -n "$MODMANAGER" ]; then
            point amml-modmanager "$MODMANAGER"
          fi

      - uses: jdx/mise-action@v2
        with:
          working_directory: ${{ inputs.path }}

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.path }}/target
          key: cargo-${{ hashFiles(format('{0}/Cargo.lock', inputs.path), format('{0}/rust-toolchain.toml', inputs.path)) }}
          restore-keys: |
            cargo-

      # Cargo.lock records each workspace crate's version, so it is rewritten with the new one. Every workspace crate
      # must then report the release version; only the test fixture crates keep their own.
      - name: Check that every crate has the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          cargo metadata --format-version 1 > /dev/null
          wrong=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg v "$VERSION" '.packages[]
                | select(.manifest_path | gsub("\\\\"; "/") | contains("/tests/fixtures/") | not)
                | select(.version != $v)
                | "\(.name) \(.version)"')
          if [ -n "$wrong" ]; then
            echo "::error::these crates do not have version $VERSION:"
            echo "$wrong"
            exit 1
          fi

      - run: mise run check
      - run: mise run test

      - name: Run the extra task
        if: ${{ inputs.extra_task != '' }}
        env:
          EXTRA_TASK: ${{ inputs.extra_task }}
        run: mise run "$EXTRA_TASK"

      - name: Package
        env:
          PACKAGE_TASK: ${{ inputs.package_task }}
        run: mise run "$PACKAGE_TASK"

      # The loader reads `version` from amml.hcl; the release version is the only source of it.
      - name: Write the mod version
        if: ${{ inputs.registry }}
        env:
          VERSION: ${{ inputs.version }}
          NAMESPACE: ${{ inputs.namespace }}
          MOD_NAME: ${{ inputs.name }}
        run: |
          set -eu
          manifest="dist/@$NAMESPACE/$MOD_NAME/amml.hcl"
          test -f "$manifest"
          if grep -qE '^version[[:space:]]*=' "$manifest"; then
            sed -E -i "s/^version[[:space:]]*=.*/version     = \"$VERSION\"/" "$manifest"
          else
            if [ -n "$(tail -c 1 "$manifest")" ]; then
              printf '\n' >> "$manifest"
            fi
            printf 'version     = "%s"\n' "$VERSION" >> "$manifest"
          fi
          count=$(grep -cE '^version[[:space:]]*=' "$manifest" || true)
          if [ "$count" != "1" ] || ! grep -qE "^version[[:space:]]*=[[:space:]]*\"$VERSION\"" "$manifest"; then
            echo "::error::$manifest does not have exactly one version = \"$VERSION\" line"
            exit 1
          fi

      - uses: actions/cache@v6
        if: ${{ inputs.registry }}
        with:
          path: amml-tools/target
          key: registry-tool-${{ hashFiles('amml-tools/Cargo.lock', 'amml-tools/rust-toolchain.toml') }}
          restore-keys: |
            registry-tool-

      - name: Build the registry tool
        if: ${{ inputs.registry }}
        working-directory: ${{ github.workspace }}/amml-tools
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/amml-tools
        run: |
          mise install
          mise run build-registry

      - name: Lint the manifest
        if: ${{ inputs.registry }}
        env:
          VERSION: ${{ inputs.version }}
          NAMESPACE: ${{ inputs.namespace }}
          MOD_NAME: ${{ inputs.name }}
        run: |
          set -eu
          "$GITHUB_WORKSPACE/amml-tools/target/release/amml-registry" lint-manifest \
            "dist/@$NAMESPACE/$MOD_NAME/amml.hcl" \
            --version "$VERSION" --namespace "$NAMESPACE" --name "$MOD_NAME"

      - name: Zip and checksum
        env:
          VERSION: ${{ inputs.version }}
          NAMESPACE: ${{ inputs.namespace }}
          MOD_NAME: ${{ inputs.name }}
        run: |
          set -eu
          zip="$MOD_NAME-$VERSION-windows-x64.zip"
          rm -f "$zip" SHA256SUMS.txt
          test -d "dist/@$NAMESPACE/$MOD_NAME"
          (cd dist && 7z a -tzip "../$zip" -- "@$NAMESPACE/$MOD_NAME")
          sha256sum "$zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The tag must hold the version it names, because other repos build against the tag. The version change is
      # committed and pushed to the branch the release ran from, and the release is tagged at that commit. A push
      # that is not a fast-forward (the branch moved during the run) fails here, before any release exists.
      - name: Commit the version
        id: commit
        env:
          VERSION: ${{ inputs.version }}
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::run the release from a branch, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*Cargo.toml' Cargo.lock
          if [ -n "$DESCRIPTOR" ]; then
            git add "$DESCRIPTOR"
          fi
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MOD_NAME: ${{ inputs.name }}
          MODMANAGER: ${{ inputs.modmanager }}
          TARGET: ${{ steps.commit.outputs.sha }}
        run: |
          set -eu
          notes="Built against amml $(git -C ../amml rev-parse HEAD)"
          if [ "$MODMANAGER" = "true" ]; then
            notes="$notes and amml-modmanager $(git -C ../modmanager-amml rev-parse HEAD)"
          fi
          gh release create "$VERSION" "$MOD_NAME-$VERSION-windows-x64.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$MOD_NAME $VERSION" \
            --latest=true \
            --generate-notes \
            --notes "$notes"

  # Tells the registry about the release. A failure here fails this job only; the release above stays as it is.
  notify-registry:
    needs: release
    if: ${{ inputs.registry }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the App secrets
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          set -eu
          if [ -n "$APP_ID" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry not notified: no App secrets"
          fi

      - name: Get the GitHub App token
        id: app-token
        if: ${{ steps.app.outputs.notify == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: alaydriem
          repositories: amml-registry
          permission-contents: write

      - name: Send the release to the registry
        if: ${{ steps.app.outputs.notify == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          NAMESPACE: ${{ inputs.namespace }}
          MOD_NAME: ${{ inputs.name }}
        run: |
          set -eu
          case "$VERSION" in
            *-*)
              echo "::notice::pre-release $VERSION is not sent to the registry"
              exit 0
              ;;
          esac
          gh api repos/alaydriem/amml-registry/dispatches \
            -f event_type=amml-released \
            -f "client_payload[kind]=mod" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[namespace]=$NAMESPACE" \
            -f "client_payload[name]=$MOD_NAME" \
            -f "client_payload[version]=$VERSION"
