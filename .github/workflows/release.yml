name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, 26.<game minor>.<AMML patch> (26.60.1). The patch is the AMML release counter on that game line, not the Minecraft build; the supported game builds go in game_versions
        required: true
        type: string
      game_versions:
        description: Tested game versions, comma separated (1.26.60.5)
        required: true
        type: string
      dry_run:
        description: Build and gate everything, list the release files, and stop before the commit, the push and the release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency: release

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
      latest: ${{ steps.kind.outputs.latest }}
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::version '$VERSION' is not Cargo semver (for example 26.60.1)"
            exit 1
          fi

      - name: Check that the run is from a branch
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::run the release from a branch, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Decide the release kind
        id: kind
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          prerelease=false
          latest=true
          case "$VERSION" in
            *-*)
              prerelease=true
              latest=false
              ;;
            *)
              existing=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | grep -v -e '-' || true)
              highest=$(printf '%s\n%s\n' "$existing" "$VERSION" | grep -v '^$' | sort -V | tail -n 1)
              if [ "$highest" != "$VERSION" ]; then
                latest=false
                echo "::notice::$VERSION is older than $highest, so it is not marked as the latest release"
              fi
              ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  tests:
    needs: prepare
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  i18n:
    needs: prepare
    uses: ./.github/workflows/i18n.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  build-lib:
    needs: prepare
    uses: ./.github/workflows/build-lib.yml
    with:
      build_mode: release
      ref: ${{ github.sha }}
      version: ${{ inputs.version }}
      game_versions: ${{ inputs.game_versions }}
    secrets: inherit

  build-launcher:
    needs: prepare
    if: needs.prepare.outputs.prerelease != 'true'
    uses: ./.github/workflows/build-launcher.yml
    with:
      build_mode: release
      ref: ${{ github.sha }}
      version: ${{ inputs.version }}
    secrets: inherit

  publish:
    needs: [prepare, checks, tests, build-lib, build-launcher]
    if: >-
      ${{ always()
      && needs.prepare.result == 'success'
      && needs.checks.result == 'success'
      && needs.tests.result == 'success'
      && needs.build-lib.result == 'success'
      && (needs.build-launcher.result == 'success' || needs.build-launcher.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
      api_version: ${{ steps.meta.outputs.api_version }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v5
        with:
          name: amml-lib
          path: .

      - uses: actions/download-artifact@v5
        if: ${{ needs.build-launcher.result == 'success' }}
        with:
          name: amml-launcher
          path: launcher-dist

      - name: Read the release metadata
        id: meta
        run: |
          set -eu
          # release-meta.env holds API_VERSION and GAME_VERSIONS
          . ./release-meta.env
          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

      - name: List the release files
        if: ${{ inputs.dry_run }}
        run: |
          set -eu
          echo "::notice::dry run: no commit, push or release"
          ls -l ./*.zip SHA256SUMS.txt release-meta.env
          if [ -d launcher-dist ]; then
            ls -l launcher-dist
          fi

      # A dry run also writes the version, so it proves set-version on this runner; it commits nothing.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.2

      - name: Write the version
        env:
          VERSION: ${{ inputs.version }}
        run: mise run set-version -- "$VERSION"

      # The tag must hold the version it names, because other repos build against the tag. The version change is
      # committed and pushed to the branch the release ran from, and the release is tagged at that commit. A push
      # that is not a fast-forward (the branch moved during the run) fails here, before any release exists.
      - name: Commit the version
        id: commit
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ steps.commit.outputs.sha }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -eu
          files=("amml-$VERSION-windows-x64.zip" SHA256SUMS.txt)
          if [ -d launcher-dist ]; then
            files+=(launcher-dist/*)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            latest_args=(--prerelease --latest=false)
          else
            latest_args=(--latest="$LATEST")
          fi
          gh release create "$VERSION" \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "AMML $VERSION" \
            "${latest_args[@]}" \
            --generate-notes \
            --notes "Built from amml $TARGET"

  # Tells the registry about the release. It reads the version, API version and game versions that the publish job exposes as outputs (the publish job must declare them). A failure here fails this job only; the GitHub release stays as it is.
  notify-registry:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the App secrets
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          set -eu
          if [ -n "$APP_ID" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry not notified: no App secrets"
          fi

      - name: Get the GitHub App token
        id: app-token
        if: ${{ steps.app.outputs.notify == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: alaydriem
          repositories: amml-registry
          permission-contents: write

      - name: Send the release to the registry
        if: ${{ steps.app.outputs.notify == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          API_VERSION: ${{ needs.publish.outputs.api_version }}
          GAME_VERSIONS: ${{ needs.publish.outputs.game_versions }}
        run: |
          set -eu
          case "$VERSION" in
            *-*)
              echo "::notice::pre-release $VERSION is not sent to the registry"
              exit 0
              ;;
          esac
          if [ -z "$VERSION" ] || [ -z "$API_VERSION" ] || [ -z "$GAME_VERSIONS" ]; then
            echo "::error::the publish job exposed no version, api_version or game_versions output"
            exit 1
          fi
          gh api repos/alaydriem/amml-registry/dispatches \
            -f event_type=amml-released \
            -f "client_payload[kind]=amml" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[api_version]=$API_VERSION" \
            -f "client_payload[game_versions]=$GAME_VERSIONS"
