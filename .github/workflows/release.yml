name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, 26.<game minor>.<AMML patch> (26.60.1). The patch is the AMML release counter on that game line, not the Minecraft build; the supported game builds go in game_versions
        required: true
        type: string
      game_versions:
        description: Tested game versions, comma separated (1.26.60.5)
        required: true
        type: string

permissions:
  contents: write

concurrency: release

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ inputs.version }}
      api_version: ${{ steps.meta.outputs.api_version }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::version '$VERSION' is not Cargo semver (for example 26.60.1)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Write the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          if ! sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -qF "version = \"$VERSION\""; then
            echo "::error::Cargo.toml has no version line in [workspace.package]"
            exit 1
          fi

      - uses: jdx/mise-action@v2

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      # Cargo.lock records each workspace crate's version, so it is rewritten with the new one. Every workspace crate
      # must then report the release version; only the test fixture crates keep their own.
      - name: Check that every crate has the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          cargo metadata --format-version 1 > /dev/null
          wrong=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg v "$VERSION" '.packages[]
                | select(.manifest_path | gsub("\\\\"; "/") | contains("/tests/fixtures/") | not)
                | select(.version != $v)
                | "\(.name) \(.version)"')
          if [ -n "$wrong" ]; then
            echo "::error::these crates do not have version $VERSION:"
            echo "$wrong"
            exit 1
          fi
          if ! grep -qF "version = \"$VERSION\"" Cargo.lock; then
            echo "::error::Cargo.lock does not record version $VERSION"
            exit 1
          fi

      - run: mise run check
      - run: mise run test

      - name: Launcher is not built for a pre-release
        if: ${{ contains(inputs.version, '-') }}
        env:
          VERSION: ${{ inputs.version }}
        run: echo "::notice::pre-release $VERSION builds no launcher"

      - name: Build the launcher
        if: ${{ !contains(inputs.version, '-') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          mise run launcher-app:bundle

      - name: Assemble the launcher files
        if: ${{ !contains(inputs.version, '-') }}
        env:
          VERSION: ${{ inputs.version }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Alaydriem.AMMLLauncher' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Alaydriem' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Alaydriem' }}
        run: |
          set -eu
          mise run launcher-app:release-files -- --version "$VERSION" \
            --name "$MSIX_IDENTITY_NAME" \
            --publisher "$MSIX_PUBLISHER" \
            --publisher-display "$MSIX_PUBLISHER_DISPLAY_NAME"

      - name: Package
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          GAME_VERSIONS: ${{ inputs.game_versions }}
        run: |
          set -eu
          mise run package-release -- --version "$VERSION" --game-versions "$GAME_VERSIONS"
          # release-meta.env holds API_VERSION and GAME_VERSIONS
          . ./release-meta.env
          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

      # The tag must hold the version it names, because other repos build against the tag. The version change is
      # committed and pushed to the branch the release ran from, and the release is tagged at that commit. A push
      # that is not a fast-forward (the branch moved during the run) fails here, before any release exists.
      - name: Commit the version
        id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::run the release from a branch, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ steps.commit.outputs.sha }}
        run: |
          set -eu
          files=("amml-$VERSION-windows-x64.zip" SHA256SUMS.txt)
          if [ -d launcher-dist ]; then
            files+=(launcher-dist/*)
          fi
          latest_args=(--latest=true)
          case "$VERSION" in
            *-*) latest_args=(--prerelease --latest=false) ;;
            *)
              existing=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | grep -v -e '-' || true)
              highest=$(printf '%s\n%s\n' "$existing" "$VERSION" | grep -v '^$' | sort -V | tail -n 1)
              if [ "$highest" != "$VERSION" ]; then
                latest_args=(--latest=false)
                echo "::notice::$VERSION is older than $highest, so it is not marked as the latest release"
              fi
              ;;
          esac
          gh release create "$VERSION" \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "AMML $VERSION" \
            "${latest_args[@]}" \
            --generate-notes \
            --notes "Built from amml $TARGET"

  # Tells the registry about the release. It reads the version, API version and game versions that the release job exposes as outputs (the release job must declare them). A failure here fails this job only; the GitHub release stays as it is.
  notify-registry:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the App secrets
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          set -eu
          if [ -n "$APP_ID" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry not notified: no App secrets"
          fi

      - name: Get the GitHub App token
        id: app-token
        if: ${{ steps.app.outputs.notify == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: alaydriem
          repositories: amml-registry
          permission-contents: write

      - name: Send the release to the registry
        if: ${{ steps.app.outputs.notify == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          API_VERSION: ${{ needs.release.outputs.api_version }}
          GAME_VERSIONS: ${{ needs.release.outputs.game_versions }}
        run: |
          set -eu
          case "$VERSION" in
            *-*)
              echo "::notice::pre-release $VERSION is not sent to the registry"
              exit 0
              ;;
          esac
          if [ -z "$VERSION" ] || [ -z "$API_VERSION" ] || [ -z "$GAME_VERSIONS" ]; then
            echo "::error::the release job exposed no version, api_version or game_versions output"
            exit 1
          fi
          gh api repos/alaydriem/amml-registry/dispatches \
            -f event_type=amml-released \
            -f "client_payload[kind]=amml" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[api_version]=$API_VERSION" \
            -f "client_payload[game_versions]=$GAME_VERSIONS"
