name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, semver from the Minecraft version (26.60.5)
        required: true
        type: string

permissions:
  contents: write

concurrency: release

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::version '$VERSION' is not Cargo semver (for example 26.60.5)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Write the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          if ! sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -qF "version = \"$VERSION\""; then
            echo "::error::Cargo.toml has no version line in [workspace.package]"
            exit 1
          fi

      - uses: jdx/mise-action@v2

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test

      - name: Build the loader and the patcher
        run: cargo build --release -p amml-loader -p amml-patch

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          rm -rf stage
          zip="amml-$VERSION-windows-x64.zip"
          rm -f "$zip" SHA256SUMS.txt

          mkdir -p stage/amml
          cp target/release/amml.dll stage/amml.dll
          cp target/release/amml-patch.exe stage/amml-patch.exe
          cp -r recipes stage/amml/recipes
          (cd stage && 7z a -tzip "../$zip" -- amml.dll amml-patch.exe amml)

          sha256sum "$zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          gh release create "$VERSION" \
            "amml-$VERSION-windows-x64.zip" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMML $VERSION" \
            --latest=true \
            --generate-notes \
            --notes "Built from amml $GITHUB_SHA"
