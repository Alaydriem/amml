name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, semver from the Minecraft version (26.60.5)
        required: true
        type: string
      game_versions:
        description: Tested game versions, comma separated (1.26.60.5)
        required: true
        type: string

permissions:
  contents: write

concurrency: release

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ inputs.version }}
      api_version: ${{ steps.meta.outputs.api_version }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::version '$VERSION' is not Cargo semver (for example 26.60.5)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check that the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Write the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          if ! sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep -qF "version = \"$VERSION\""; then
            echo "::error::Cargo.toml has no version line in [workspace.package]"
            exit 1
          fi

      - uses: jdx/mise-action@v2

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test

      - name: Package
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          GAME_VERSIONS: ${{ inputs.game_versions }}
        run: |
          set -eu
          mise run package-release -- --version "$VERSION" --game-versions "$GAME_VERSIONS"
          # release-meta.env holds API_VERSION and GAME_VERSIONS
          . ./release-meta.env
          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          gh release create "$VERSION" \
            "amml-$VERSION-windows-x64.zip" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMML $VERSION" \
            --latest=true \
            --generate-notes \
            --notes "Built from amml $GITHUB_SHA"

  # Tells the registry about the release. It reads the version, API version and game versions that the release job exposes as outputs (the release job must declare them). A failure here fails this job only; the GitHub release stays as it is.
  notify-registry:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the App secrets
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          set -eu
          if [ -n "$APP_ID" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry not notified: no App secrets"
          fi

      - name: Get the GitHub App token
        id: app-token
        if: ${{ steps.app.outputs.notify == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: alaydriem
          repositories: amml-registry
          permission-contents: write

      - name: Send the release to the registry
        if: ${{ steps.app.outputs.notify == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          API_VERSION: ${{ needs.release.outputs.api_version }}
          GAME_VERSIONS: ${{ needs.release.outputs.game_versions }}
        run: |
          set -eu
          case "$VERSION" in
            *-*)
              echo "::notice::pre-release $VERSION is not sent to the registry"
              exit 0
              ;;
          esac
          if [ -z "$VERSION" ] || [ -z "$API_VERSION" ] || [ -z "$GAME_VERSIONS" ]; then
            echo "::error::the release job exposed no version, api_version or game_versions output"
            exit 1
          fi
          gh api repos/alaydriem/amml-registry/dispatches \
            -f event_type=amml-released \
            -f "client_payload[kind]=amml" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[api_version]=$API_VERSION" \
            -f "client_payload[game_versions]=$GAME_VERSIONS"
